services:
  ai-notes-xyz-agent-workspace:
    build: .
    image: ai-notes-xyz-agent-workspace
    container_name: ai-notes-xyz-agent-workspace
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Kolkata
      - CUSTOM_USER=${CUSTOM_USER:-abc}
      - PASSWORD=${PASSWORD:-agentworkspace}
      - TITLE=ai-notes-xyz-agent-workspace
      - HOST=0.0.0.0
      - EXPRESS_PORT=2001
      - API_TOKEN=${API_TOKEN:-}
      - FILE_STORAGE_PATH=/config
      - LIBREOFFICE_BIN=soffice
      - OPENCODE_SERVER_PASSWORD=${OPENCODE_SERVER_PASSWORD:-password}
      - OPENCODE_PORT=${OPENCODE_PORT:-4096}
      - OPENCODE_HOST=0.0.0.0
    volumes:
      - ./volume:/config
    ports:
      - "2001:2001"
      - "3010:3000"
      - "3011:3001"
      - "4096:4096"
    shm_size: "1gb"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

